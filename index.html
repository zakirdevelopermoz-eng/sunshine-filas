<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./sunshine-logo.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#B71C1C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunshine Hospitals — Terminal de Recepção & CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F9F8F8] text-[#1A1C1E] antialiased selection:bg-[#FFDAD6] selection:text-[#93000A]">
    <div id="root"></div>
    <script>
      // Immediately unregister any stale Service Worker that was intercepting Supabase requests
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister();
          }
        }).catch(() => {});
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key);
          }
        }).catch(() => {});
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
