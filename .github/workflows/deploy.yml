name: Deploy Sunshine Filas to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle for GitHub Pages
        env:
          GITHUB_PAGES: 'true'
          VITE_SUPABASE_URL: 'https://xpysyyfogouxapchvkwb.supabase.co'
          VITE_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_RJFeXPv9PuWg3YMgcajwaQ_bkDmfQ63'
        run: |
          npm run build
          cp dist/index.html dist/404.html
          mkdir -p dist/recepcao dist/admin dist/recepcao/A dist/recepcao/B dist/recepcao/C dist/recepcao/D
          cp dist/index.html dist/recepcao/index.html
          cp dist/index.html dist/admin/index.html
          cp dist/index.html dist/recepcao/A/index.html
          cp dist/index.html dist/recepcao/B/index.html
          cp dist/index.html dist/recepcao/C/index.html
          cp dist/index.html dist/recepcao/D/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
